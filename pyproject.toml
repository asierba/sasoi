[project]
name = "sasoi"
version = "0.1.0"
description = "Personal agent that analyses running and strength training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.19",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
sasoi = "sasoi.cli:main"
sasoi-sync = "sasoi.sync_cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "time-machine>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
